<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">

  <title>Tayta Inti</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >


  <style>

    /* =====================================================
       FUENTES
    ===================================================== */

    @font-face {
      font-family: 'Adelia';
      src: url('fuentes/Adelia.otf') format('opentype');
    }

    @font-face {
      font-family: 'Scriptorial';
      src: url('fuentes/Scriptorial.ttf') format('truetype');
    }

    @font-face {
      font-family: 'TheRustic';
      src: url('fuentes/TheRustic-Demo.otf') format('opentype');
    }


    /* =====================================================
       RESET
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {
      width: 100%;
      height: 100%;
    }


    body {

      font-family: Arial, sans-serif;

      background: #000;

      overflow: hidden;

    }


    /* =====================================================
       FONDO
    ===================================================== */

    #carrusel {

      position: fixed;

      inset: 0;

      z-index: -10;

      overflow: hidden;

      background: #000;

    }


    .fondo-carrusel {

      position: absolute;

      inset: -5%;

      background-size: cover;

      background-position: center;

      opacity: 0;

      transform: scale(1.08);

      transition:
        opacity 2s ease-in-out,
        transform 8s ease;

    }


    .fondo-activo {

      opacity: 1;

      transform: scale(1);

    }


    /* =====================================================
       CAPA OSCURA PREMIUM
    ===================================================== */

    .capa-negra {

      position: fixed;

      inset: 0;

      z-index: -9;

      background:

        linear-gradient(
          180deg,
          rgba(0,0,0,0.78) 0%,
          rgba(0,0,0,0.25) 40%,
          rgba(0,0,0,0.72) 100%
        );

    }


    /* =====================================================
       BRILLO CENTRAL
    ===================================================== */

    .capa-luz {

      position: fixed;

      inset: 0;

      z-index: -8;

      pointer-events: none;

      background:

        radial-gradient(
          circle at 50% 45%,
          rgba(255,255,255,0.10),
          transparent 43%
        );

    }


    /* =====================================================
       CONTENEDOR
    ===================================================== */

    .contenedor {

      position: relative;

      width: 100%;

      height: 100vh;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

      text-align: center;

      padding:
        100px 25px 65px;

      animation:
        entradaGeneral 1.4s ease forwards;

    }


    @keyframes entradaGeneral {

      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }

    }


    /* =====================================================
       REDES SOCIALES
    ===================================================== */

    .iconos-izquierda {

      position: absolute;

      top: 25px;

      left: 35px;

      display: flex;

      gap: 14px;

      z-index: 999;

    }


    .iconos-izquierda a,
    .iconos-derecha a {

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .iconos-izquierda img {

      width: 52px;

      height: 52px;

      object-fit: contain;

      filter:
        brightness(0)
        invert(1);

      opacity: 0.9;

      transition:
        transform .4s ease,
        opacity .4s ease,
        filter .4s ease;

    }


    .iconos-izquierda img:hover {

      transform:
        translateY(-4px)
        scale(1.15);

      opacity: 1;

      filter:
        brightness(1.3)
        drop-shadow(
          0 0 10px
          rgba(255,255,255,.6)
        );

    }


    /* =====================================================
       ICONOS DERECHA
    ===================================================== */

    .iconos-derecha {

      position: absolute;

      top: 27px;

      right: 35px;

      display: flex;

      gap: 17px;

      z-index: 999;

    }


    .iconos-derecha img {

      width: 42px;

      height: 42px;

      object-fit: contain;

      filter:
        brightness(0)
        invert(1);

      opacity: .9;

      transition:
        transform .4s ease,
        opacity .4s ease,
        filter .4s ease;

    }


    .iconos-derecha img:hover {

      transform:
        translateY(-4px)
        scale(1.15);

      opacity: 1;

      filter:
        brightness(1.3)
        drop-shadow(
          0 0 10px
          rgba(255,255,255,.6)
        );

    }


    /* =====================================================
       LOGO
    ===================================================== */

    .logo2 {

      width: 255px;

      max-width: 70%;

      margin-bottom: 25px;

      opacity: 0;

      animation:
        entradaLogo 1.5s ease .2s forwards,
        flotacion 6s ease-in-out 1.8s infinite;

      filter:
        drop-shadow(
          0 5px 20px
          rgba(0,0,0,.35)
        );

    }


    @keyframes entradaLogo {

      from {

        opacity: 0;

        transform:
          translateY(-35px)
          scale(.88);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    @keyframes flotacion {

      0%,
      100% {

        transform:
          translateY(0);

      }

      50% {

        transform:
          translateY(-7px);

      }

    }


    /* =====================================================
       FRASE
    ===================================================== */

    .texto-explora {

      position: relative;

      color:
        rgba(255,255,255,.92);

      font-family:
        'Scriptorial',
        cursive;

      font-size: 20px;

      letter-spacing: 2.5px;

      margin-bottom: 32px;

      opacity: 0;

      animation:
        aparecerTexto
        1.2s ease
        .9s forwards;

    }


    .texto-explora::before,
    .texto-explora::after {

      content: "";

      display: inline-block;

      width: 35px;

      height: 1px;

      vertical-align: middle;

      background:
        rgba(255,255,255,.55);

      margin: 0 14px;

    }


    @keyframes aparecerTexto {

      from {

        opacity: 0;

        transform:
          translateY(15px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    /* =====================================================
       CATEGORÍAS
    ===================================================== */

    .botones {

      display: flex;

      justify-content: center;

      align-items: stretch;

      flex-wrap: wrap;

      gap: 17px;

      width: 100%;

      max-width: 1150px;

    }


    /* =====================================================
       TARJETA PREMIUM
    ===================================================== */

    .boton-cuadrado {

      position: relative;

      width: 205px;

      height: 105px;

      overflow: hidden;

      border-radius: 4px;

      border:
        1px solid
        rgba(255,255,255,.60);

      background:
        rgba(0,0,0,.32);

      backdrop-filter:
        blur(7px);

      color: #fff;

      font-family:
        'Adelia',
        serif;

      font-size: 17px;

      font-weight: normal;

      letter-spacing: 1.8px;

      line-height: 1.25;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      text-decoration: none;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.30);

      transition:
        transform .5s ease,
        box-shadow .5s ease,
        border-color .5s ease;

      opacity: 0;

      animation:
        entradaBoton
        .9s ease
        forwards;

    }


    /* =====================================================
       ENTRADA INDIVIDUAL
    ===================================================== */

    .boton-cuadrado:nth-child(1) {
      animation-delay: 1.1s;
    }

    .boton-cuadrado:nth-child(2) {
      animation-delay: 1.25s;
    }

    .boton-cuadrado:nth-child(3) {
      animation-delay: 1.4s;
    }

    .boton-cuadrado:nth-child(4) {
      animation-delay: 1.55s;
    }

    .boton-cuadrado:nth-child(5) {
      animation-delay: 1.7s;
    }


    @keyframes entradaBoton {

      from {

        opacity: 0;

        transform:
          translateY(25px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    /* =====================================================
       IMAGEN PREVIEW
    ===================================================== */

    .preview {

      position: absolute;

      inset: 0;

      background-size: cover;

      background-position: center;

      opacity: 0;

      transform: scale(1.12);

      transition:
        opacity .7s ease,
        transform 1s ease;

    }


    .preview::after {

      content: "";

      position: absolute;

      inset: 0;

      background:

        linear-gradient(
          135deg,
          rgba(0,0,0,.58),
          rgba(0,0,0,.25),
          rgba(0,0,0,.58)
        );

    }


    /* =====================================================
       NOMBRE
    ===================================================== */

    .nombre-categoria {

      position: relative;

      z-index: 5;

      padding: 10px 15px;

      text-shadow:
        0 2px 10px
        rgba(0,0,0,.9);

      transition:
        transform .45s ease,
        letter-spacing .45s ease;

    }


    /* =====================================================
       HOVER PREMIUM
    ===================================================== */

    .boton-cuadrado:hover {

      transform:
        translateY(-9px)
        scale(1.035);

      border-color:
        rgba(255,255,255,.95);

      box-shadow:
        0 18px 45px
        rgba(0,0,0,.55);

    }


    .boton-cuadrado:hover
    .preview {

      opacity: 1;

      transform:
        scale(1);

    }


    .boton-cuadrado:hover
    .nombre-categoria {

      transform:
        scale(1.07);

      letter-spacing:
        2.3px;

    }


    /* =====================================================
       LÍNEA DECORATIVA
    ===================================================== */

    .boton-cuadrado::after {

      content: "";

      position: absolute;

      bottom: 12px;

      left: 50%;

      width: 0;

      height: 1px;

      background:
        rgba(255,255,255,.85);

      transform:
        translateX(-50%);

      transition:
        width .5s ease;

      z-index: 6;

    }


    .boton-cuadrado:hover::after {

      width: 55px;

    }


    /* =====================================================
       EFECTO DE BRILLO
    ===================================================== */

    .boton-cuadrado::before {

      content: "";

      position: absolute;

      top: 0;

      left: -120%;

      width: 65%;

      height: 100%;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.22),
          transparent
        );

      transform:
        skewX(-20deg);

      transition:
        left .9s ease;

      z-index: 7;

    }


    .boton-cuadrado:hover::before {

      left: 140%;

    }


    /* =====================================================
       FLECHAS
    ===================================================== */

    .flecha {

      position: absolute;

      top: 50%;

      transform:
        translateY(-50%);

      width: 45px;

      height: 45px;

      border:
        1px solid
        rgba(255,255,255,.45);

      border-radius: 50%;

      background:
        rgba(0,0,0,.25);

      color: white;

      font-size: 25px;

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      z-index: 20;

      opacity: 0;

      transition:
        opacity .4s ease,
        transform .4s ease,
        background .4s ease;

    }


    .contenedor:hover .flecha {

      opacity: .75;

    }


    .flecha:hover {

      opacity: 1 !important;

      background:
        rgba(255,255,255,.15);

      transform:
        translateY(-50%)
        scale(1.12);

    }


    .flecha-izquierda {

      left: 25px;

    }


    .flecha-derecha {

      right: 25px;

    }


    /* =====================================================
       INDICADORES
    ===================================================== */

    .indicadores {

      position: absolute;

      bottom: 27px;

      left: 50%;

      transform:
        translateX(-50%);

      display: flex;

      gap: 9px;

    }


    .indicador {

      width: 7px;

      height: 7px;

      border-radius: 50%;

      background:
        rgba(255,255,255,.38);

      cursor: pointer;

      transition:
        transform .35s ease,
        background .35s ease;

    }


    .indicador.activo {

      background: white;

      transform:
        scale(1.6);

    }


    /* =====================================================
       RESPONSIVE TABLET
    ===================================================== */

    @media (max-width: 950px) {

      .botones {

        max-width: 680px;

      }

      .boton-cuadrado {

        width: 190px;

      }

    }


    /* =====================================================
       RESPONSIVE MÓVIL
    ===================================================== */

    @media (max-width: 600px) {


      .contenedor {

        padding:
          90px 12px 60px;

      }


      /* REDES */

      .iconos-izquierda {

        top: 17px;

        left: 15px;

        gap: 5px;

      }


      .iconos-izquierda img {

        width: 41px;

        height: 41px;

      }


      /* NAVEGACIÓN */

      .iconos-derecha {

        top: 19px;

        right: 15px;

        gap: 9px;

      }


      .iconos-derecha img {

        width: 34px;

        height: 34px;

      }


      /* LOGO */

      .logo2 {

        width: 170px;

        margin-bottom: 18px;

      }


      /* FRASE */

      .texto-explora {

        font-size: 16px;

        letter-spacing: 1.5px;

        margin-bottom: 20px;

      }


      .texto-explora::before,
      .texto-explora::after {

        width: 18px;

        margin: 0 7px;

      }


      /* CATEGORÍAS */

      .botones {

        width: 100%;

        max-height: 55vh;

        overflow-y: auto;

        gap: 9px;

        padding:
          5px 10px;

      }


      .boton-cuadrado {

        width: 100%;

        max-width: 310px;

        height: 62px;

        min-height: 62px;

        border-radius: 4px;

        font-size: 15px;

        letter-spacing: 1.4px;

      }


      .nombre-categoria {

        font-size: 15px;

      }


      /* PREVIEW EN MÓVIL */

      .preview {

        opacity: .30;

        transform: scale(1);

      }


      /* FLECHAS */

      .flecha {

        width: 37px;

        height: 37px;

        font-size: 20px;

        opacity: .65;

      }


      .flecha-izquierda {

        left: 6px;

      }


      .flecha-derecha {

        right: 6px;

      }


    }


    /* =====================================================
       REDUCIR ANIMACIONES SI EL USUARIO LO PREFIERE
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation: none !important;

        transition: none !important;

      }

    }

  </style>

</head>


<body>

    <button
      class="flecha flecha-derecha"

      aria-label="Fondo siguiente">

      ›

  <!-- =====================================================
       JAVASCRIPT
  ===================================================== -->

  <script>


    /* =====================================================
       IMÁGENES DE FONDO
    ===================================================== */

    const imagenes = [

      'imagenes/fondo400.jpg',

      'imagenes/fondo1000.jpg',

      'imagenes/fondo2000.jpg',

      'imagenes/fondo3000.jpg',

      'imagenes/fondo4000.jpg'

    ];


    const carrusel =
      document.getElementById(
        'carrusel'
      );


    const indicadores =
      document.getElementById(
        'indicadores'
      );


    let indice = 0;


    /* =====================================================
       CREAR FONDOS
    ===================================================== */

    imagenes.forEach(
      (img, i) => {

        const fondo =
          document.createElement(
            'div'
          );

        fondo.className =
          'fondo-carrusel' +
          (
            i === 0
              ? ' fondo-activo'
              : ''
          );

        fondo.style.backgroundImage =
          `url('${img}')`;

        carrusel.appendChild(
          fondo
        );


        /* INDICADOR */

        const punto =
          document.createElement(
            'div'
          );

        punto.className =
          'indicador' +
          (
            i === 0
              ? ' activo'
              : ''
          );


        punto.onclick = () => {

          mostrarFondo(i);

          reiniciarTemporizador();

        };


        indicadores.appendChild(
          punto
        );

      }
    );


    const fondos =
      document.querySelectorAll(
        '.fondo-carrusel'
      );


    const puntos =
      document.querySelectorAll(
        '.indicador'
      );


    /* =====================================================
       MOSTRAR FONDO
    ===================================================== */

    function mostrarFondo(
      nuevoIndice
    ) {

      fondos[indice]
        .classList
        .remove(
          'fondo-activo'
        );


      puntos[indice]
        .classList
        .remove(
          'activo'
        );


      indice =
        nuevoIndice;


      fondos[indice]
        .classList
        .add(
          'fondo-activo'
        );


      puntos[indice]
        .classList
        .add(
          'activo'
        );

    }


    /* =====================================================
       CAMBIAR FONDO
    ===================================================== */

    function cambiarFondo(
      direccion
    ) {

      let nuevo =
        indice + direccion;


      if (
        nuevo >= imagenes.length
      ) {

        nuevo = 0;

      }


      if (nuevo < 0) {

        nuevo =
          imagenes.length - 1;

      }


      mostrarFondo(
        nuevo
      );


      reiniciarTemporizador();

    }


    /* =====================================================
       CAMBIO AUTOMÁTICO
    ===================================================== */

    let temporizador =
      setInterval(
        avanzarAutomaticamente,
        5000
      );


    function avanzarAutomaticamente() {

      const nuevo =
        (
          indice + 1
        ) %
        imagenes.length;


      mostrarFondo(
        nuevo
      );

    }


    /* =====================================================
       REINICIAR TEMPORIZADOR
    ===================================================== */

    function reiniciarTemporizador() {

      clearInterval(
        temporizador
      );


      temporizador =
        setInterval(
          avanzarAutomaticamente,
          5000
        );

    }


    /* =====================================================
       SWIPE PARA CELULAR
    ===================================================== */

    let inicioX = 0;


    document.addEventListener(
      'touchstart',
      evento => {

        inicioX =
          evento.touches[0].clientX;

      },
      {
        passive: true
      }
    );


    document.addEventListener(
      'touchend',
      evento => {

        const finalX =
          evento.changedTouches[0].clientX;


        const diferencia =
          inicioX - finalX;


        if (
          Math.abs(diferencia) > 50
        ) {

          if (
            diferencia > 0
          ) {

            cambiarFondo(1);

          } else {

            cambiarFondo(-1);

          }

        }

      },
      {
        passive: true
      }
    );
