<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Oils & Balsams | Tayta Inti</title>


  <style>

    /* =====================================================
       FUENTES
    ===================================================== */

    @font-face {

      font-family: 'Adelia';

      src:
        url('fuentes/Adelia.otf')
        format('opentype');

    }


    @font-face {

      font-family: 'Scriptorial';

      src:
        url('fuentes/Scriptorial.ttf')
        format('truetype');

    }


    /* =====================================================
       RESET
    ===================================================== */

    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }


    html {

      scroll-behavior: smooth;

    }


    body {

      margin: 0;

      min-height: 100vh;

      font-family: Arial, sans-serif;

      color: white;

      background: #000;

      overflow-x: hidden;

    }


    /* =====================================================
       FONDO
    ===================================================== */

    body::before {

      content: "";

      position: fixed;

      inset: -5%;

      z-index: -5;

      background-image:
        url('imagenes/oils.png');

      background-size: cover;

      background-position: center;

      transform: scale(1.05);

      animation:
        fondoMovimiento 15s ease-in-out infinite alternate;

    }


    @keyframes fondoMovimiento {

      from {

        transform:
          scale(1.05)
          translate(0,0);

      }

      to {

        transform:
          scale(1.12)
          translate(-1%, -1%);

      }

    }


    /* =====================================================
       CAPA OSCURA
    ===================================================== */

    body::after {

      content: "";

      position: fixed;

      inset: 0;

      z-index: -4;

      pointer-events: none;

      background:

        linear-gradient(
          180deg,
          rgba(0,0,0,.78) 0%,
          rgba(0,0,0,.48) 45%,
          rgba(0,0,0,.80) 100%
        );

    }


    /* =====================================================
       CONTENEDOR
    ===================================================== */

    .contenedor-principal {

      position: relative;

      min-height: 100vh;

      padding:
        35px 30px 80px;

      background:

        radial-gradient(
          circle at center,
          rgba(255,255,255,.06),
          transparent 50%
        );

    }


    /* =====================================================
       NAVEGACIÓN
    ===================================================== */

    .top-icons {

      position: fixed;

      top: 22px;

      right: 30px;

      display: flex;

      gap: 14px;

      z-index: 2000;

    }


    .top-icons a {

      width: 45px;

      height: 45px;

      display: flex;

      align-items: center;

      justify-content: center;

      border:

        1px solid
        rgba(255,255,255,.45);

      border-radius: 50%;

      background:
        rgba(0,0,0,.25);

      backdrop-filter:
        blur(6px);

      transition:

        transform .35s ease,
        background .35s ease,
        border-color .35s ease;

    }


    .top-icons img {

      width: 29px;

      height: 29px;

      object-fit: contain;

      filter:

        brightness(0)
        invert(1);

      transition:
        transform .35s ease;

    }


    .top-icons a:hover {

      transform:
        translateY(-4px)
        scale(1.08);

      background:
        rgba(255,255,255,.16);

      border-color: white;

    }


    .top-icons a:hover img {

      transform: scale(1.08);

    }


    /* =====================================================
       LOGO
    ===================================================== */

    .logo2 {

      display: block;

      width: 220px;

      max-width: 65%;

      height: auto;

      margin:
        20px auto 15px;

      filter:
        drop-shadow(
          0 5px 20px
          rgba(0,0,0,.45)
        );

      opacity: 0;

      animation:
        logoEntrada 1.2s ease .2s forwards;

    }


    @keyframes logoEntrada {

      from {

        opacity: 0;

        transform:
          translateY(-25px)
          scale(.92);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    /* =====================================================
       TÍTULO
    ===================================================== */

    .titulo {

      text-align: center;

      margin-bottom: 45px;

      opacity: 0;

      animation:
        aparecer 1s ease .6s forwards;

    }


    .titulo h1 {

      font-family:
        'Adelia',
        serif;

      font-size: 32px;

      font-weight: normal;

      letter-spacing: 3px;

      text-transform: uppercase;

      text-shadow:
        0 3px 12px
        rgba(0,0,0,.8);

    }


    .titulo-linea {

      width: 70px;

      height: 1px;

      margin:
        15px auto;

      background:
        rgba(255,255,255,.75);

    }


    .titulo p {

      font-family:
        'Scriptorial',
        cursive;

      font-size: 17px;

      letter-spacing: 1.5px;

      color:
        rgba(255,255,255,.82);

    }


    @keyframes aparecer {

      from {

        opacity: 0;

        transform:
          translateY(15px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    /* =====================================================
       PRODUCTOS
    ===================================================== */

    .productos {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 25px;

      justify-items: center;

      max-width: 1150px;

      margin: 0 auto;

    }


    /* =====================================================
       TARJETA
    ===================================================== */

    .product {

      position: relative;

      width: 100%;

      max-width: 310px;

      min-height: 135px;

      padding: 30px 25px;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      text-decoration: none;

      color: white;

      overflow: hidden;

      border:

        1px solid
        rgba(255,255,255,.35);

      border-radius: 5px;

      background:
        rgba(0,0,0,.30);

      backdrop-filter:
        blur(8px);

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.30);

      transition:

        transform .5s ease,
        box-shadow .5s ease,
        border-color .5s ease,
        background .5s ease;

      opacity: 0;

      animation:
        tarjetaEntrada .8s ease forwards;

    }


    /* =====================================================
       ANIMACIÓN DE TARJETAS
    ===================================================== */

    .product:nth-child(1) {
      animation-delay: .9s;
    }

    .product:nth-child(2) {
      animation-delay: 1s;
    }

    .product:nth-child(3) {
      animation-delay: 1.1s;
    }

    .product:nth-child(4) {
      animation-delay: 1.2s;
    }

    .product:nth-child(5) {
      animation-delay: 1.3s;
    }

    .product:nth-child(6) {
      animation-delay: 1.4s;
    }

    .product:nth-child(7) {
      animation-delay: 1.5s;
    }

    .product:nth-child(8) {
      animation-delay: 1.6s;
    }

    .product:nth-child(9) {
      animation-delay: 1.7s;
    }


    @keyframes tarjetaEntrada {

      from {

        opacity: 0;

        transform:
          translateY(30px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    /* =====================================================
       LÍNEA DECORATIVA
    ===================================================== */

    .product::before {

      content: "";

      position: absolute;

      left: 50%;

      bottom: 15px;

      width: 0;

      height: 1px;

      background:
        rgba(255,255,255,.9);

      transform:
        translateX(-50%);

      transition:
        width .5s ease;

    }


    .product:hover::before {

      width: 50px;

    }


    /* =====================================================
       BRILLO
    ===================================================== */

    .product::after {

      content: "";

      position: absolute;

      top: 0;

      left: -120%;

      width: 60%;

      height: 100%;

      background:

        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.18),
          transparent
        );

      transform:
        skewX(-20deg);

      transition:
        left .8s ease;

    }


    .product:hover::after {

      left: 140%;

    }


    /* =====================================================
       HOVER
    ===================================================== */

    .product:hover {

      transform:
        translateY(-10px)
        scale(1.025);

      background:
        rgba(255,255,255,.09);

      border-color:
        rgba(255,255,255,.85);

      box-shadow:
        0 20px 45px
        rgba(0,0,0,.55);

    }


    /* =====================================================
       NOMBRE DEL PRODUCTO
    ===================================================== */

    .product h2 {

      position: relative;

      z-index: 5;

      font-family:
        'Adelia',
        serif;

      font-size: 18px;

      font-weight: normal;

      line-height: 1.45;

      letter-spacing: 1.2px;

      text-shadow:
        0 2px 8px
        rgba(0,0,0,.9);

      transition:
        transform .4s ease,
        letter-spacing .4s ease;

    }


    .product:hover h2 {

      transform:
        scale(1.04);

      letter-spacing:
        1.6px;

    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 900px) {

      .productos {

        grid-template-columns:
          repeat(2, 1fr);

        max-width: 700px;

      }

      .product {

        max-width: 310px;

      }

    }


    /* =====================================================
       MÓVIL
    ===================================================== */

    @media (max-width: 600px) {

      .contenedor-principal {

        padding:
          25px 15px 60px;

      }


      .top-icons {

        top: 14px;

        right: 15px;

        gap: 8px;

      }


      .top-icons a {

        width: 38px;

        height: 38px;

      }


      .top-icons img {

        width: 24px;

        height: 24px;

      }


      .logo2 {

        width: 160px;

        margin-top: 30px;

      }


      .titulo {

        margin-bottom: 30px;

      }


      .titulo h1 {

        font-size: 23px;

        letter-spacing: 2px;

      }


      .titulo p {

        font-size: 15px;

      }


      .productos {

        grid-template-columns: 1fr;

        gap: 13px;

        max-width: 340px;

      }


      .product {

        max-width: 100%;

        min-height: 85px;

        padding: 20px;

      }


      .product h2 {

        font-size: 16px;

        letter-spacing: 1px;

      }

    }


    /* =====================================================
       ACCESIBILIDAD
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation: none !important;

        transition: none !important;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       ICONOS
  ===================================================== -->

  <div class="top-icons">


    <a href="index.html">

      <img
        src="imagenes/Home.jpg"
        alt="Home">

    </a>


    <a href="formulario.html">

      <img
        src="imagenes/Carrito.png"
        alt="Carrito">

    </a>


  </div>


  <!-- =====================================================
       CONTENIDO
  ===================================================== -->

  <main class="contenedor-principal">


    <!-- LOGO -->

    <img
      src="imagenes/logo2.png"
      alt="Tayta Inti"
      class="logo2">


    <!-- TÍTULO -->

    <div class="titulo">

      <h1>
        Oils & Balsams
      </h1>

      <div class="titulo-linea"></div>

      <p>
        Botanical oils from the Peruvian Amazon
      </p>

    </div>


    <!-- ===================================================
         PRODUCTOS
    =================================================== -->

    <div
      class="productos"
      id="productos">
    </div>


  </main>


  <!-- =====================================================
       JAVASCRIPT
  ===================================================== -->

  <script>

    const productos = [

      {
        nombre:
          "Coffee Oil (Coffea Arabica)",

        enlace:
          "coffeshop2.html"
      },


      {
        nombre:
          "Cacao Oil (Theobroma cacao)",

        enlace:
          "cacaoshop2.html"
      },


      {
        nombre:
          "Passion Fruit Oil (Passiflora Edulis)",

        enlace:
          "passionfruitshop2.html"
      },


      {
        nombre:
          "Buriti Oil (Mauritia flexuosa)",

        enlace:
          "buritishop2.html"
      },


      {
        nombre:
          "Ungurahui Oil (Oenocarpus bataua)",

        enlace:
          "ungurahuishop2.html"
      },


      {
        nombre:
          "Copaiba Oil (Copaifera officinalis)",

        enlace:
          "copaibashop2.html"
      },


      {
        nombre:
          "Dragon’s Blood (Croton lechleri)",

        enlace:
          "dragonshop2.html"
      },


      {
        nombre:
          "Peruvian Coconut Oil (Cocos nucifera)",

        enlace:
          "peruviancocoshop2.html"
      },


      {
        nombre:
          "Guarana Oil (Paullinia cupana)",

        enlace:
          "guaranaoil.html"
      }

    ];


    const contenedor =
      document.getElementById(
        'productos'
      );


    productos.forEach(
      producto => {

        contenedor.innerHTML += `

          <a
            href="${producto.enlace}"
            class="product">

            <h2>
              ${producto.nombre}
            </h2>

          </a>

        `;

      }
    );

  </script>


</body>

</html>
