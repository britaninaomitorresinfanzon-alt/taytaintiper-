
<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Extracts | Tayta Inti</title>

  <style>

    /* =====================================================
       FUENTES
    ===================================================== */

    @font-face {
      font-family: 'Adelia';
      src: url('fuentes/Adelia.otf') format('opentype');
    }

    @font-face {
      font-family: 'Scriptorial';
      src: url('fuentes/Scriptorial.ttf') format('truetype');
    }

    /* =====================================================
       GENERAL
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: #000;
      overflow-x: hidden;
    }

    /* =====================================================
       FONDO
    ===================================================== */

    body::before {
      content: "";
      position: fixed;
      inset: -5%;
      z-index: -5;

      background-image:
        url('imagenes/extracts.png');

      background-size: cover;
      background-position: center;

      transform: scale(1.05);

      animation:
        fondoMovimiento 15s ease-in-out infinite alternate;
    }

    @keyframes fondoMovimiento {

      from {
        transform: scale(1.05);
      }

      to {
        transform: scale(1.12);
      }

    }

    /* =====================================================
       CAPA OSCURA
    ===================================================== */

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -4;
      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.78),
          rgba(0,0,0,.45),
          rgba(0,0,0,.82)
        );
    }

    /* =====================================================
       CONTENEDOR
    ===================================================== */

    .contenedor-principal {
      min-height: 100vh;

      padding:
        35px 30px 80px;

      background:
        radial-gradient(
          circle at center,
          rgba(255,255,255,.06),
          transparent 50%
        );
    }

    /* =====================================================
       ICONOS SUPERIORES
    ===================================================== */

    .top-icons {
      position: fixed;

      top: 22px;
      right: 30px;

      display: flex;
      gap: 14px;

      z-index: 2000;
    }

    .top-icons a {
      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid
        rgba(255,255,255,.45);

      border-radius: 50%;

      background:
        rgba(0,0,0,.25);

      backdrop-filter:
        blur(6px);

      transition:
        transform .35s ease,
        background .35s ease;
    }

    .top-icons img {
      width: 29px;
      height: 29px;

      object-fit: contain;

      filter:
        brightness(0)
        invert(1);
    }

    .top-icons a:hover {
      transform:
        translateY(-4px)
        scale(1.08);

      background:
        rgba(255,255,255,.16);
    }

    /* =====================================================
       LOGO
    ===================================================== */

    .logo2 {
      display: block;

      width: 220px;
      max-width: 65%;

      height: auto;

      margin:
        20px auto 15px;

      filter:
        drop-shadow(
          0 5px 20px
          rgba(0,0,0,.5)
        );

      animation:
        logoEntrada 1.2s ease forwards;
    }

    @keyframes logoEntrada {

      from {
        opacity: 0;
        transform:
          translateY(-25px)
          scale(.92);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }

    }

    /* =====================================================
       TÍTULO GENERAL
    ===================================================== */

    .titulo {
      text-align: center;

      margin-bottom: 45px;

      animation:
        aparecer 1s ease .4s both;
    }

    .titulo h1 {
      font-family:
        'Adelia',
        serif;

      font-size: 32px;

      font-weight: normal;

      letter-spacing: 3px;

      text-transform: uppercase;

      text-shadow:
        0 3px 12px
        rgba(0,0,0,.8);
    }

    .titulo-linea {
      width: 70px;

      height: 1px;

      margin:
        15px auto;

      background:
        rgba(255,255,255,.75);
    }

    .titulo p {
      font-family:
        'Scriptorial',
        cursive;

      font-size: 17px;

      letter-spacing: 1.5px;

      color:
        rgba(255,255,255,.85);
    }

    @keyframes aparecer {

      from {
        opacity: 0;
        transform:
          translateY(15px);
      }

      to {
        opacity: 1;
        transform:
          translateY(0);
      }

    }

    /* =====================================================
       PRODUCTOS
    ===================================================== */

    .productos {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 25px;

      justify-items: center;

      max-width: 1150px;

      margin: 0 auto;
    }

    /* =====================================================
       BOTÓN PRODUCTO
    ===================================================== */

    .product {
      position: relative;

      width: 100%;

      max-width: 310px;

      min-height: 135px;

      padding:
        30px 25px;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      text-decoration: none;

      color: white;

      overflow: hidden;

      border:
        1px solid
        rgba(255,255,255,.35);

      border-radius: 5px;

      background:
        rgba(0,0,0,.30);

      backdrop-filter:
        blur(8px);

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.30);

      transition:
        transform .5s ease,
        box-shadow .5s ease,
        border-color .5s ease;

      opacity: 0;

      animation:
        tarjetaEntrada .8s ease forwards;
    }

    /* =====================================================
       ANIMACIÓN DE ENTRADA
    ===================================================== */

    .product:nth-child(1) {
      animation-delay: .8s;
    }

    @keyframes tarjetaEntrada {

      from {
        opacity: 0;

        transform:
          translateY(30px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }

    /* =====================================================
       IMAGEN
    ===================================================== */

    .product img {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      opacity: 0;

      transform:
        scale(1.15);

      transition:
        opacity .5s ease,
        transform .8s ease;

      z-index: 1;
    }

    /* =====================================================
       CAPA OSCURA SOBRE LA IMAGEN
    ===================================================== */

    .product .imagen-overlay {
      position: absolute;

      inset: 0;

      background:
        rgba(0,0,0,.45);

      opacity: 0;

      transition:
        opacity .5s ease;

      z-index: 2;
    }

    /* =====================================================
       NOMBRE EN LAS TARJETAS
    ===================================================== */

    .product h2 {
      position: relative;

      z-index: 5;

      font-family:
        'Adelia',
        serif;

      font-size: 18px;

      font-weight: normal;

      line-height: 1.45;

      letter-spacing: 1.2px;

      text-shadow:
        0 2px 8px
        rgba(0,0,0,1);

      transition:
        transform .4s ease,
        letter-spacing .4s ease;
    }

    /* =====================================================
       HOVER
    ===================================================== */

    .product:hover {
      transform:
        translateY(-10px)
        scale(1.025);

      border-color:
        rgba(255,255,255,.9);

      box-shadow:
        0 20px 45px
        rgba(0,0,0,.6);
    }

    .product:hover img {
      opacity: 1;

      transform:
        scale(1);
    }

    .product:hover .imagen-overlay {
      opacity: 1;
    }

    .product:hover h2 {
      transform:
        scale(1.04);

      letter-spacing:
        1.5px;
    }

    /* =====================================================
       EFECTO BRILLO
    ===================================================== */

    .product::after {
      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 60%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.18),
          transparent
        );

      transform:
        skewX(-20deg);

      transition:
        left .8s ease;

      z-index: 6;
    }

    .product:hover::after {
      left: 140%;
    }

    /* =====================================================
       LÍNEA DECORATIVA
    ===================================================== */

    .product .linea {
      position: absolute;

      bottom: 12px;
      left: 50%;

      width: 0;
      height: 1px;

      transform:
        translateX(-50%);

      background:
        white;

      transition:
        width .4s ease;

      z-index: 7;
    }

    .product:hover .linea {
      width: 50px;
    }

    /* =====================================================
       DETALLE DEL PRODUCTO
    ===================================================== */

    .detalle-producto {
      display: none;

      max-width: 950px;

      margin: 0 auto;

      text-align: center;

      animation:
        detalleEntrada .8s ease both;
    }

    .detalle-producto.activo {
      display: block;
    }

    @keyframes detalleEntrada {

      from {
        opacity: 0;
        transform:
          translateY(25px);
      }

      to {
        opacity: 1;
        transform:
          translateY(0);
      }

    }

    .detalle-imagen {
      display: block;

      width: 100%;

      max-width: 440px;

      max-height: 430px;

      object-fit: contain;

      margin: 0 auto 30px;

      border-radius: 5px;

      filter:
        drop-shadow(
          0 12px 30px
          rgba(0,0,0,.65)
        );
    }

    /* =====================================================
       NOMBRE DENTRO DEL DETALLE
    ===================================================== */

    .detalle-nombre {
      font-family:
        'Scriptorial',
        cursive;

      font-size: 30px;

      font-weight: normal;

      line-height: 1.5;

      letter-spacing: 2px;

      text-shadow:
        0 3px 12px
        rgba(0,0,0,.9);

      margin-bottom: 20px;
    }

    .detalle-linea {
      width: 80px;

      height: 1px;

      background:
        rgba(255,255,255,.8);

      margin: 0 auto 25px;
    }

    /* =====================================================
       DESCRIPCIÓN DENTRO DEL DETALLE
    ===================================================== */

    .detalle-descripcion {
      max-width: 760px;

      margin: 0 auto;

      font-family:
        'Adelia',
        serif;

      font-size: 20px;

      line-height: 1.8;

      letter-spacing: .5px;

      color:
        rgba(255,255,255,.9);

      text-shadow:
        0 2px 8px
        rgba(0,0,0,.8);
    }

    .volver-productos {
      display: inline-block;

      margin-top: 40px;

      padding: 14px 28px;

      border:
        1px solid
        rgba(255,255,255,.55);

      border-radius: 5px;

      background:
        rgba(0,0,0,.35);

      color: white;

      font-family:
        'Adelia',
        serif;

      font-size: 15px;

      letter-spacing: 1px;

      cursor: pointer;

      transition:
        background .35s ease,
        transform .35s ease,
        border-color .35s ease;
    }

    .volver-productos:hover {
      background:
        rgba(255,255,255,.15);

      border-color:
        white;

      transform:
        translateY(-4px);
    }

    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 900px) {

      .productos {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }

    /* =====================================================
       MÓVIL
    ===================================================== */

    @media (max-width: 600px) {

      .contenedor-principal {
        padding:
          25px 15px 60px;
      }

      .top-icons {
        top: 14px;
        right: 15px;
        gap: 8px;
      }

      .top-icons a {
        width: 38px;
        height: 38px;
      }

      .top-icons img {
        width: 24px;
        height: 24px;
      }

      .logo2 {
        width: 160px;
        margin-top: 30px;
      }

      .titulo {
        margin-bottom: 30px;
      }

      .titulo h1 {
        font-size: 23px;
        letter-spacing: 2px;
      }

      .titulo p {
        font-size: 15px;
      }

      .productos {
        grid-template-columns: 1fr;
        gap: 13px;
      }

      .product {
        max-width: 340px;
        min-height: 100px;
        padding: 20px;
      }

      .product h2 {
        font-size: 16px;
      }

      .detalle-nombre {
        font-size: 23px;
        letter-spacing: 1px;
      }

      .detalle-descripcion {
        font-size: 17px;
        line-height: 1.7;
      }

      .detalle-imagen {
        max-width: 90%;
      }

    }

    /* =====================================================
       ACCESIBILIDAD
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation: none !important;

        transition: none !important;

      }

    }

  </style>

</head>

<body>

  <!-- =====================================================
       ICONOS SUPERIORES
  ===================================================== -->

  <div class="top-icons">

    <a href="index.html">

      <img
        src="imagenes/Home.jpg"
        alt="Home">

    </a>

    <a href="formulario.html">

      <img
        src="imagenes/Carrito.png"
        alt="Carrito">

    </a>

  </div>

  <!-- =====================================================
       CONTENIDO
  ===================================================== -->

  <main class="contenedor-principal">

    <!-- LOGO -->

    <img
      src="imagenes/logo2.png"
      alt="Tayta Inti"
      class="logo2">

    <!-- TÍTULO GENERAL -->

    <div class="titulo">

      <h1 id="titulo-seccion">
        Extracts
      </h1>

      <div class="titulo-linea"></div>

      <p id="subtitulo-seccion">
        Natural Peruvian botanical extracts
      </p>

    </div>

    <!-- PRODUCTOS -->

    <div
      class="productos"
      id="productos">
    </div>

    <!-- DETALLE DEL PRODUCTO -->

    <section
      class="detalle-producto"
      id="detalle-producto"
      aria-live="polite">

      <img
        src=""
        alt=""
        class="detalle-imagen"
        id="detalle-imagen">

      <h2
        class="detalle-nombre"
        id="detalle-nombre">
      </h2>

      <div class="detalle-linea"></div>

      <p
        class="detalle-descripcion"
        id="detalle-descripcion">
      </p>

      <button
        class="volver-productos"
        id="volver-productos"
        type="button">

        ← Back to Extracts

      </button>

    </section>

  </main>

  <script>

    const productos = [

      {
        nombre:
          "Graviola Leaf Extract (Annona muricata)",

        imagen:
          "imagenes/graviola.jpg",

        descripcion:
          "Graviola Leaf Extract is derived from the leaves of Annona muricata, a tropical tree native to the Americas and widely found in the Peruvian Amazon. This botanical extract is valued for its natural plant compounds and traditional use in Amazonian preparations. It is suitable for botanical, cosmetic, and natural product formulations."
      }

    ];

    const contenedor =
      document.getElementById('productos');

    const detalle =
      document.getElementById('detalle-producto');

    const detalleImagen =
      document.getElementById('detalle-imagen');

    const detalleNombre =
      document.getElementById('detalle-nombre');

    const detalleDescripcion =
      document.getElementById('detalle-descripcion');

    const volver =
      document.getElementById('volver-productos');

    const tituloSeccion =
      document.getElementById('titulo-seccion');

    const subtituloSeccion =
      document.getElementById('subtitulo-seccion');

    /* =====================================================
       CREAR TARJETAS
    ===================================================== */

    productos.forEach((p, indice) => {

      contenedor.innerHTML += `

        <a
          href="#"
          class="product"
          data-producto="${indice}">

          <img
            src="${p.imagen}"
            alt="${p.nombre}">

          <div
            class="imagen-overlay">
          </div>

          <h2>
            ${p.nombre}
          </h2>

          <div
            class="linea">
          </div>

        </a>

      `;

    });

    /* =====================================================
       ABRIR DETALLE
    ===================================================== */

    document.querySelectorAll('.product').forEach(producto => {

      producto.addEventListener('click', function(event) {

        event.preventDefault();

        const indice =
          this.getAttribute('data-producto');

        const productoSeleccionado =
          productos[indice];

        detalleImagen.src =
          productoSeleccionado.imagen;

        detalleImagen.alt =
          productoSeleccionado.nombre;

        detalleNombre.textContent =
          productoSeleccionado.nombre;

        detalleDescripcion.textContent =
          productoSeleccionado.descripcion;

        contenedor.style.display = 'none';

        detalle.classList.add('activo');

        tituloSeccion.textContent =
          'Product Details';

        subtituloSeccion.textContent =
          'Discover our natural Peruvian botanical extracts';

        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });

      });

    });

    /* =====================================================
       VOLVER A LA LISTA
    ===================================================== */

    volver.addEventListener('click', function() {

      detalle.classList.remove('activo');

      contenedor.style.display = 'grid';

      tituloSeccion.textContent =
        'Extracts';

      subtituloSeccion.textContent =
        'Natural Peruvian botanical extracts';

      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });

    });

  </script>

</body>

</html>
