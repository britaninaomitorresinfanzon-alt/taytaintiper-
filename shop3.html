<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Powders | Tayta Inti</title>


  <style>

    /* =====================================================
       FUENTES
    ===================================================== */

    @font-face {
      font-family: 'Adelia';
      src: url('fuentes/Adelia.otf') format('opentype');
    }

    @font-face {
      font-family: 'Scriptorial';
      src: url('fuentes/Scriptorial.ttf') format('truetype');
    }


    /* =====================================================
       GENERAL
    ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: #000;
      overflow-x: hidden;
    }


    /* =====================================================
       FONDO
    ===================================================== */

    body::before {
      content: "";
      position: fixed;
      inset: -5%;
      z-index: -5;

      background-image:
        url('imagenes/powders.png');

      background-size: cover;
      background-position: center;

      transform: scale(1.05);

      animation:
        fondoMovimiento 15s ease-in-out infinite alternate;
    }

    @keyframes fondoMovimiento {

      from {
        transform: scale(1.05);
      }

      to {
        transform: scale(1.12);
      }

    }


    /* =====================================================
       CAPA OSCURA
    ===================================================== */

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -4;
      pointer-events: none;

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.78),
          rgba(0,0,0,.45),
          rgba(0,0,0,.82)
        );
    }


    /* =====================================================
       CONTENEDOR
    ===================================================== */

    .contenedor-principal {
      min-height: 100vh;

      padding:
        35px 30px 80px;

      background:
        radial-gradient(
          circle at center,
          rgba(255,255,255,.06),
          transparent 50%
        );
    }


    /* =====================================================
       ICONOS SUPERIORES
    ===================================================== */

    .top-icons {
      position: fixed;

      top: 22px;
      right: 30px;

      display: flex;
      gap: 14px;

      z-index: 2000;
    }

    .top-icons a {
      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      border:
        1px solid
        rgba(255,255,255,.45);

      border-radius: 50%;

      background:
        rgba(0,0,0,.25);

      backdrop-filter:
        blur(6px);

      transition:
        transform .35s ease,
        background .35s ease;
    }

    .top-icons img {
      width: 29px;
      height: 29px;

      object-fit: contain;

      filter:
        brightness(0)
        invert(1);
    }

    .top-icons a:hover {
      transform:
        translateY(-4px)
        scale(1.08);

      background:
        rgba(255,255,255,.16);
    }


    /* =====================================================
       LOGO
    ===================================================== */

    .logo2 {
      display: block;

      width: 220px;
      max-width: 65%;

      height: auto;

      margin:
        20px auto 15px;

      filter:
        drop-shadow(
          0 5px 20px
          rgba(0,0,0,.5)
        );

      animation:
        logoEntrada 1.2s ease forwards;
    }

    @keyframes logoEntrada {

      from {
        opacity: 0;
        transform:
          translateY(-25px)
          scale(.92);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }

    }


    /* =====================================================
       TÍTULO
    ===================================================== */

    .titulo {
      text-align: center;

      margin-bottom: 45px;

      animation:
        aparecer 1s ease .4s both;
    }

    .titulo h1 {
      font-family:
        'Adelia',
        serif;

      font-size: 32px;

      font-weight: normal;

      letter-spacing: 3px;

      text-transform: uppercase;

      text-shadow:
        0 3px 12px
        rgba(0,0,0,.8);
    }

    .titulo-linea {
      width: 70px;

      height: 1px;

      margin:
        15px auto;

      background:
        rgba(255,255,255,.75);
    }

    .titulo p {
      font-family:
        'Scriptorial',
        cursive;

      font-size: 17px;

      letter-spacing: 1.5px;

      color:
        rgba(255,255,255,.85);
    }

    @keyframes aparecer {

      from {
        opacity: 0;
        transform:
          translateY(15px);
      }

      to {
        opacity: 1;
        transform:
          translateY(0);
      }

    }


    /* =====================================================
       PRODUCTOS
    ===================================================== */

    .productos {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 25px;

      justify-items: center;

      max-width: 1150px;

      margin: 0 auto;
    }


    /* =====================================================
       BOTÓN PRODUCTO
    ===================================================== */

    .product {
      position: relative;

      width: 100%;

      max-width: 310px;

      min-height: 135px;

      padding:
        30px 25px;

      display: flex;

      align-items: center;

      justify-content: center;

      text-align: center;

      text-decoration: none;

      color: white;

      overflow: hidden;

      border:
        1px solid
        rgba(255,255,255,.35);

      border-radius: 5px;

      background:
        rgba(0,0,0,.30);

      backdrop-filter:
        blur(8px);

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.30);

      transition:
        transform .5s ease,
        box-shadow .5s ease,
        border-color .5s ease;

      opacity: 0;

      animation:
        tarjetaEntrada .8s ease forwards;
    }


    /* =====================================================
       ANIMACIÓN DE ENTRADA
    ===================================================== */

    .product:nth-child(1) {
      animation-delay: .8s;
    }

    .product:nth-child(2) {
      animation-delay: .9s;
    }

    .product:nth-child(3) {
      animation-delay: 1s;
    }

    .product:nth-child(4) {
      animation-delay: 1.1s;
    }

    .product:nth-child(5) {
      animation-delay: 1.2s;
    }

    .product:nth-child(6) {
      animation-delay: 1.3s;
    }

    .product:nth-child(7) {
      animation-delay: 1.4s;
    }

    .product:nth-child(8) {
      animation-delay: 1.5s;
    }

    .product:nth-child(9) {
      animation-delay: 1.6s;
    }

    .product:nth-child(10) {
      animation-delay: 1.7s;
    }

    .product:nth-child(11) {
      animation-delay: 1.8s;
    }

    .product:nth-child(12) {
      animation-delay: 1.9s;
    }

    .product:nth-child(13) {
      animation-delay: 2s;
    }

    .product:nth-child(14) {
      animation-delay: 2.1s;
    }


    @keyframes tarjetaEntrada {

      from {
        opacity: 0;

        transform:
          translateY(30px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    /* =====================================================
       IMAGEN
    ===================================================== */

    .product img {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      opacity: 0;

      transform:
        scale(1.15);

      transition:
        opacity .5s ease,
        transform .8s ease;

      z-index: 1;
    }


    /* =====================================================
       CAPA OSCURA SOBRE LA IMAGEN
    ===================================================== */

    .product .imagen-overlay {
      position: absolute;

      inset: 0;

      background:
        rgba(0,0,0,.45);

      opacity: 0;

      transition:
        opacity .5s ease;

      z-index: 2;
    }


    /* =====================================================
       NOMBRE
    ===================================================== */

    .product h2 {
      position: relative;

      z-index: 5;

      font-family:
        'Adelia',
        serif;

      font-size: 18px;

      font-weight: normal;

      line-height: 1.45;

      letter-spacing: 1.2px;

      text-shadow:
        0 2px 8px
        rgba(0,0,0,1);

      transition:
        transform .4s ease,
        letter-spacing .4s ease;
    }


    /* =====================================================
       HOVER
    ===================================================== */

    .product:hover {
      transform:
        translateY(-10px)
        scale(1.025);

      border-color:
        rgba(255,255,255,.9);

      box-shadow:
        0 20px 45px
        rgba(0,0,0,.6);
    }

    .product:hover img {
      opacity: 1;

      transform:
        scale(1);
    }

    .product:hover .imagen-overlay {
      opacity: 1;
    }

    .product:hover h2 {
      transform:
        scale(1.04);

      letter-spacing:
        1.5px;
    }


    /* =====================================================
       EFECTO BRILLO
    ===================================================== */

    .product::after {
      content: "";

      position: absolute;

      top: 0;
      left: -120%;

      width: 60%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,.18),
          transparent
        );

      transform:
        skewX(-20deg);

      transition:
        left .8s ease;

      z-index: 6;
    }

    .product:hover::after {
      left: 140%;
    }


    /* =====================================================
       LÍNEA DECORATIVA
    ===================================================== */

    .product .linea {
      position: absolute;

      bottom: 12px;
      left: 50%;

      width: 0;
      height: 1px;

      transform:
        translateX(-50%);

      background:
        white;

      transition:
        width .4s ease;

      z-index: 7;
    }

    .product:hover .linea {
      width: 50px;
    }


    /* =====================================================
       TABLET
    ===================================================== */

    @media (max-width: 900px) {

      .productos {
        grid-template-columns:
          repeat(2, 1fr);
      }

    }


    /* =====================================================
       MÓVIL
    ===================================================== */

    @media (max-width: 600px) {

      .contenedor-principal {
        padding:
          25px 15px 60px;
      }

      .top-icons {
        top: 14px;
        right: 15px;
        gap: 8px;
      }

      .top-icons a {
        width: 38px;
        height: 38px;
      }

      .top-icons img {
        width: 24px;
        height: 24px;
      }

      .logo2 {
        width: 160px;
        margin-top: 30px;
      }

      .titulo {
        margin-bottom: 30px;
      }

      .titulo h1 {
        font-size: 23px;
        letter-spacing: 2px;
      }

      .titulo p {
        font-size: 15px;
      }

      .productos {
        grid-template-columns: 1fr;
        gap: 13px;
      }

      .product {
        max-width: 340px;
        min-height: 100px;
        padding: 20px;
      }

      .product h2 {
        font-size: 16px;
      }

    }


    /* =====================================================
       ACCESIBILIDAD
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation: none !important;

        transition: none !important;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       ICONOS SUPERIORES
  ===================================================== -->

  <div class="top-icons">

    <a href="index.html">

      <img
        src="imagenes/Home.jpg"
        alt="Home">

    </a>


    <a href="formulario.html">

      <img
        src="imagenes/Carrito.png"
        alt="Carrito">

    </a>

  </div>


  <!-- =====================================================
       CONTENIDO
  ===================================================== -->

  <main class="contenedor-principal">


    <!-- LOGO -->

    <img
      src="imagenes/logo2.png"
      alt="Tayta Inti"
      class="logo2">


    <!-- TÍTULO -->

    <div class="titulo">

      <h1>
        Powders
      </h1>

      <div class="titulo-linea"></div>

      <p>
        Natural Peruvian botanical powders
      </p>

    </div>


    <!-- PRODUCTOS -->

    <div
      class="productos"
      id="productos">
    </div>


  </main>


  <script>

    const productos = [

      {
        nombre:
          "Maca Root Powder (Lepidium meyenii)",

        imagen:
          "imagenes/macarootpowder.png",

        enlace:
          "MacaRootPowder.html"
      },


      {
        nombre:
          "Guayusa Leaf Powder (Ilex guayusa)",

        imagen:
          "imagenes/guayusapowder.png",

        enlace:
          "GuayusaLeafPowder.html"
      },


      {
        nombre:
          "Acai Berry Powder (Euterpe olereace)",

        imagen:
          "imagenes/acaiberrypowder.png",

        enlace:
          "AçaiBerryPowder.html"
      },


      {
        nombre:
          "Garlic Powder (Allium sativum)",

        imagen:
          "imagenes/garlicpowder.png",

        enlace:
          "GarlicPowder.html"
      },


      {
        nombre:
          "Ginger Powder (Zingiber officinale)",

        imagen:
          "imagenes/gingerpowder.png",

        enlace:
          "GingerPowder.html"
      },


      {
        nombre:
          "Arrowroot Powder (Maranta arundinacea)",

        imagen:
          "imagenes/arrowrootpowder.png",

        enlace:
          "ArrowrootPowder.html"
      },


      {
        nombre:
          "Guanabana / Graviola Leaf Powder (Annona muricata)",

        imagen:
          "imagenes/graviolapowder.png",

        enlace:
          "GraviolaLeafPowder.html"
      },


      {
        nombre:
          "Sacha Jergón Powder (Dracontium loretense)",

        imagen:
          "imagenes/graviola.jpg",

        enlace:
          "SachaJergonPowder.html"
      },


      {
        nombre:
          "Algarrobo Powder (Prosopis pallida)",

        imagen:
          "imagenes/algarrobopowder.png",

        enlace:
          "AlgarroboPowder.html"
      },


      {
        nombre:
          "Cat´s Claw Powder (Uncaria tomentosa)",

        imagen:
          "imagenes/catsclawpowder.png",

        enlace:
          "CatsClawPowder.html"
      },


      {
        nombre:
          "Yacon Powder (Smallanthus sonchifolius)",

        imagen:
          "imagenes/yaconpowder.png",

        enlace:
          "YaconPowder.html"
      },


      {
        nombre:
          "Sweet Potato Powder (Ipomoea batatas)",

        imagen:
          "imagenes/sweetpotato.png",

        enlace:
          "SweetPotatoPowder.html"
      },


      {
        nombre:
          "Cacao Powder (Theobroma cacao)",

        imagen:
          "imagenes/cacaopowder.png",

        enlace:
          "CacaoPowder.html"
      },


      {
        nombre:
          "Huanarpo Macho (Jatropha macrantha)",

        imagen:
          "imagenes/huanarpomacho.png",

        enlace:
          "HuanarpoMacho.html"
      }

    ];


    const contenedor =
      document.getElementById(
        'productos'
      );


    productos.forEach(p => {

      contenedor.innerHTML += `

        <a
          href="${p.enlace}"
          class="product">

          <img
            src="${p.imagen}"
            alt="${p.nombre}">

          <div
            class="imagen-overlay">
          </div>

          <h2>
            ${p.nombre}
          </h2>

          <div
            class="linea">
          </div>

        </a>

      `;

    });

  </script>


</body>

</html>
